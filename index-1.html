<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>

:root{color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.45 Figtree,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}

.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 8px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.sc{flex:0 0 84%;scroll-snap-align:center;border-radius:24px;padding:20px;color:#fff;min-height:190px;display:flex;flex-direction:column;justify-content:space-between}
.sc .big{font-size:56px;line-height:1}

.dots{display:flex;justify-content:center;gap:8px;margin:6px 0 16px}
.dots i{width:8px;height:8px;border-radius:9px;background:var(--ln);transition:.2s}

.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pr{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--ln)}

.pr b{font-size:15px;line-height:1.2}
.pr small{color:var(--mu)}
.btn{background:var(--red);color:#fff;border:0;border-radius:14px;min-height:52px;padding:0 18px;font:700 17px Figtree,sans-serif;width:100%}
.btn.s{min-height:44px;font-size:15px}
.btn.o{background:transparent;color:var(--red);border:2px solid var(--red)}
.btn.g2{background:var(--ok)}

.box{background:var(--card);border-radius:18px;padding:16px;border:1px solid var(--ln);margin-bottom:12px}

.bd.ok{background:var(--ok)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--ln);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}

#fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--red2);color:#fff;border:0;border-radius:99px;padding:14px 20px;font:700 16px Figtree,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.25);display:none}
#sh{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}

#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:30;display:none;font-weight:600;max-width:90%}
.tl{list-style:none;padding:0;margin:10px 0 0}
.tl li{display:flex;gap:10px;align-items:center;padding:5px 0;color:var(--mu);font-size:14px}
.tl li:before{content:"";width:14px;height:14px;border-radius:50%;background:var(--ln);flex:none}
.tl li.d{color:var(--tx)}.tl li.d:before{background:var(--ok)}
.tl li.c{color:var(--tx);font-weight:700}.tl li.c:before{background:var(--wa)}
.msg{max-width:80%;padding:10px 14px;border-radius:18px;margin:6px 0;font-size:15px}
.me{background:var(--red);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.su{background:var(--card);border:1px solid var(--ln);border-bottom-left-radius:4px}
.bar{height:14px;background:var(--ln);border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.bal{background:var(--red);color:#fff;border-radius:24px;padding:22px;margin-bottom:12px}
.bal .f{font-size:36px;font-weight:800}

.pm input{width:20px;min-height:20px}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:linear-gradient(160deg,#fff 0%,#ffe9eb 55%,#ffcdd2 100%)}
#bg .bl{position:absolute;inset:0;opacity:0;transition:opacity 1.4s;background-repeat:no-repeat;background-image:var(--lg)}
#bg .bl.on{opacity:.24}
#bg .b0{background-position:center;background-size:72vmin}
#bg .b1{background-position:35% 40%;background-size:56vmin;animation:fl 6s ease-in-out infinite alternate}
#bg .b2{background-position:112% 108%;background-size:100vmin}
#bg .b3{background-image:var(--lg),var(--lg);background-repeat:repeat-x,repeat-x;background-size:90px,90px;background-position:0 22%,45px 68%;animation:pan 5s linear infinite}
@keyframes fl{from{background-position:30% 35%;transform:rotate(-7deg)}to{background-position:70% 65%;transform:rotate(7deg)}}
@keyframes pan{from{background-position:0 22%,45px 68%}to{background-position:-180px 22%,-135px 68%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style id="ja-v3-css">
/* ===== J-A v3 : bande défilante + améliorations ===== */
body{--sa:env(safe-area-inset-bottom,0px);--tk:36px;--tkb:calc(var(--tk) + var(--sa));--tkp:0px}
body.tk-off,body.kb{--tk:0px;--tkb:0px;--tkp:var(--sa)}
body nav{bottom:var(--tkb);padding-bottom:var(--tkp)}
body #app{padding-bottom:calc(84px + var(--tk) + var(--sa))}
body #fab,body #cn,body #upb,body [aria-label="Haut de page"]{bottom:calc(78px + var(--tk) + var(--sa))!important}
/* bande */
#tk{position:fixed;left:0;right:0;bottom:0;z-index:6;height:var(--tkb);padding-bottom:var(--sa);background:linear-gradient(135deg,#C23844,#8D2A35);color:#fff;display:flex;align-items:stretch;overflow:hidden;box-shadow:0 -2px 10px rgba(0,0,0,.12)}
body.tk-off #tk,body.kb #tk{display:none}
#tkx{flex:none;width:38px;border:0;background:rgba(0,0,0,.18);color:#fff;font:700 14px sans-serif;cursor:pointer}
.tkv{flex:1;overflow:hidden;padding-right:68px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 84px),transparent calc(100% - 68px));mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 84px),transparent calc(100% - 68px))}
.tkt{display:flex;width:max-content;height:100%;align-items:center;animation:tkm var(--tkd,40s) linear infinite;will-change:transform}
#tk:hover .tkt,#tk:active .tkt,#tk:focus-within .tkt{animation-play-state:paused!important}
.tkg{display:inline-flex;align-items:center;flex:none}
.tki{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font:600 13px Figtree,system-ui,sans-serif;padding:0 14px;color:#fff;background:none;border:0;height:100%}
.tki[data-p],.tki[data-go]{cursor:pointer}
.tki svg{display:block;flex:none}
.tkd{opacity:.55;font-size:10px}
.tkn{background:#F6C453;color:#201d1e;border-radius:99px;padding:2px 8px;font-weight:800;font-size:11px;animation:tkp 1.6s ease-in-out infinite alternate}
@keyframes tkm{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes tkp{from{opacity:.75}to{opacity:1}}
#tko{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + var(--sa));z-index:6;display:none;border:0;border-radius:99px 99px 0 0;background:var(--red);color:#fff;font:700 12px Figtree,sans-serif;padding:4px 14px;box-shadow:0 -2px 8px rgba(0,0,0,.18)}
body.tk-off:not(.kb) #tko{display:block}
@media (prefers-reduced-motion:reduce){.tkt{animation:tkm var(--tkd,40s) linear infinite!important}}
/* progression de lecture */
#pg{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,#F6C453,#fff);z-index:41;pointer-events:none;transition:width .1s}
/* en-tête compact + logo cliquable */
header{transition:padding .2s,box-shadow .2s}
header.sm{padding-top:6px;padding-bottom:6px;box-shadow:0 4px 18px rgba(0,0,0,.2)}
#lg{cursor:pointer;transform-origin:left center;transition:transform .2s}
header.sm #lg{transform:scale(.82)}
/* menu bas */
nav button{position:relative;transition:color .2s,transform .12s}
nav button.on::before{content:"";position:absolute;top:0;left:50%;width:30px;height:3px;margin-left:-15px;border-radius:0 0 4px 4px;background:var(--red);animation:nbi .25s ease-out}
@keyframes nbi{from{transform:scaleX(0)}to{transform:scaleX(1)}}
nav .nb{position:absolute;top:4px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font:800 11px/18px Figtree,sans-serif;font-style:normal;text-align:center;box-shadow:0 0 0 2px #fff}
.btn,.pill,nav button,.chip{transition:transform .12s,opacity .2s}
.btn:active,.pill:active,nav button:active,.chip:active{transform:scale(.96)}
/* fenêtres (sheet) */
#sh>div{overscroll-behavior:contain}
#sh>div::before{content:"";display:block;width:42px;height:4px;border-radius:4px;background:#cfc9c6;margin:-8px auto 12px}
.shx{position:sticky;top:0;float:right;margin:-8px -4px 0 8px;width:36px;height:36px;border-radius:50%;border:0;background:var(--card);color:var(--tx);font:700 16px sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.18);z-index:3}
body:has(#sh[style*="flex"]){overflow:hidden}
/* toast */
#toast{top:calc(66px + env(safe-area-inset-top,0px));cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25);border-radius:14px}
/* accessibilité */
.skip{position:fixed;left:8px;top:-70px;z-index:100;background:#fff;color:var(--red);padding:10px 14px;border-radius:12px;font-weight:700;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.skip:focus{top:8px}
main:focus{outline:none}
html{scroll-behavior:smooth}
/* économie de données */
body.lite #bg .bl{animation:none!important;transition:none}
body.lite #bg canvas{display:none}
/* impression */
@media print{nav,#tk,#tko,#fab,#cn,#upb,#pg,#toast,header .pill,.skip{display:none!important}body{background:#fff}#bg{display:none}#app{padding-bottom:0!important}}
</style></head>
<body><div id="bg"><i class="bl b0"></i><i class="bl b1"></i><i class="bl b2"></i><i class="bl b3"></i></div><div id="app">

<script>
const $=s=>document.querySelector(s);
const fmt=n=>Math.round(n).toLocaleString('fr-FR')+' FCFA';
const C={GA:{n:'Gabon',v:'Libreville',pay:['Airtel Money','Moov Money'],mk:['Mont-Bouët','Marché d’Akébé','Marché de Nkembo']},
SN:{n:'Sénégal',v:'Dakar',pay:['Wave','Orange Money'],mk:['Marché Sandaga','Marché Kermel','Marché HLM']}};
const SV=[{t:'Achats locaux',d:'En stock à Libreville et Dakar, livré dans la journée.',e:'🛍️',bg:'#D91E2E'},
{t:'Commandes Gabon ⇄ Sénégal',d:'Commandez de l’autre côté de la frontière. Suivi jusqu’à votre porte.',e:'✈️',bg:'#B3172A'},
{t:'Faire mon marché à ma place',d:'Un coursier fait vos courses au marché et vous livre à domicile.',e:'🧺',bg:'#8A1020'}];
const P1=[{n:'Robe wax',p:18000,e:'👗',t:1,s:1},{n:'Chemise en lin',p:12500,e:'👔',t:1,s:1},{n:'Sac à main',p:9000,e:'👜',s:1},{n:'Casquette',p:4500,e:'🧢',s:1},{n:'Sandales cuir',p:15000,e:'👡',s:1},{n:'Montre classique',p:22000,e:'⌚',s:1}];
const P2={'SN>GA':[{n:'Boubou brodé',p:35000,e:'🥻',d:'7 à 10 jours'},{n:'Bissap en poudre (1 kg)',p:3500,e:'🌺',d:'5 à 7 jours'},{n:'Savon noir artisanal',p:2500,e:'🧼',d:'5 à 7 jours'}],
'GA>SN':[{n:'Poisson fumé (1 kg)',p:8000,e:'🐟',d:'6 à 9 jours'},{n:'Huile de palme (2 L)',p:5000,e:'🛢️',d:'6 à 9 jours'},{n:'Bâtons de manioc (lot)',p:4000,e:'🌿',d:'6 à 9 jours'}]};
const STEPS=[['Validée','En préparation','En cours de livraison','Livrée'],['Validée','En préparation','En transit','En livraison','Livrée'],['Validée','Au marché','En cours de livraison','Livrée']];
const CH=['Tomates','Oignons','Manioc','Poisson frais','Banane plantain','Piment','Riz (5 kg)','Huile','Gombo','Poulet'];
const S={c:'GA',svc:0,tab:'home',cart:[],list:[],dir:'SN>GA',wallet:25000,goal:150000,saved:45000,
orders:[{id:'JA-4821',svc:0,items:[{n:'Robe wax',p:18000,e:'👗'}],total:18000,step:3,date:'20 oct.',pay:'Airtel Money'},
{id:'JA-4790',svc:2,items:[{n:'Courses au Mont-Bouët (8 articles)',p:16500,e:'🧺'}],total:16500,step:1,date:'25 oct.',pay:'Wallet Djah'}],
tx:[['Épargne tontine',10000,1],['Recharge Airtel Money',30000,1],['Paiement JA-4790',-16500,0]],
msgs:[['su','Bonjour 👋 Je suis votre conseiller j-a_Market. Comment puis-je vous aider ?']],
users:[['Mireille O.','Libreville','Gabon',62000],['Cheikh D.','Dakar','Sénégal',148000],['Brice M.','Port-Gentil','Gabon',9000],['Awa S.','Thiès','Sénégal',37500]]};
const NAV=[['home','🏠','Accueil'],['orders','📦','Commandes'],['wallet','👛','Wallet'],['chat','💬','Chat'],['admin','⚙️','Admin']];
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2600)}
function openS(h){$('#shc').innerHTML=h;$('#sh').style.display='flex'}

function toggleC(){S.c=S.c==='GA'?'SN':'GA';S.dir=S.c==='GA'?'SN>GA':'GA>SN';S.cart=[];S.list=[];go(S.tab)}
function go(t){S.tab=t;sv();if(t!=='admin')S.adm=0;$('#lg').innerHTML=lg(44);$('#nv').innerHTML=NAV.map(n=>`<button class="${n[0]===t?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('');
$('#cb').textContent='📍 '+C[S.c].n+' ⇄';
const f=$('#fab');f.style.display=S.cart.length?'block':'none';f.textContent='🛒 '+S.cart.length+' · '+fmt(S.cart.reduce((a,b)=>a+b.p,0));
({home:rHome,orders:rOrders,wallet:rWallet,chat:rChat,admin:rAdmin})[t]();window.scrollTo(0,0)}
function lg(s){return `<svg width="${s}" height="${s}" viewBox="0 0 200 200" role="img" aria-label="Logo j-A market"><defs><clipPath id="cp"><polygon points="0,115.4 0,0 200,0 200,200 84.6,200"/></clipPath><linearGradient id="fg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#b9b9c0"/></linearGradient></defs><g clip-path="url(#cp)"><circle cx="100" cy="100" r="90" fill="#B3172A"/><circle cx="100" cy="100" r="87" fill="none" stroke="#fff" stroke-width="6"/></g><path d="M15.4 130.8Q50 132 56 148Q62 165 69.2 184.6Z" fill="url(#fg)"/><text x="100" y="112" text-anchor="middle" font-family="Bricolage Grotesque,Georgia,serif" font-size="64" font-weight="800" font-style="italic" fill="#fff">j-A</text><text x="160" y="150" text-anchor="end" font-family="Bricolage Grotesque,Georgia,serif" font-size="24" font-weight="700" fill="#fff">_market</text><line x1="74" y1="158" x2="160" y2="158" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>`}
function sv(){try{localStorage.setItem('ja',JSON.stringify({c:S.c,wallet:S.wallet,saved:S.saved,orders:S.orders,tx:S.tx,msgs:S.msgs}))}catch(e){}}
function ld(){try{const d=JSON.parse(localStorage.getItem('ja')||'null');if(d){Object.assign(S,d);S.dir=S.c==='GA'?'SN>GA':'GA>SN'}}catch(e){}}
function gate(){$('#main').innerHTML=`<div class="pad"><div class="box" style="text-align:center"><div style="font-size:44px">🔒</div><h2>Espace administrateur</h2><p style="color:var(--mu);margin:6px 0">Entrez le code administrateur.</p><input id="pn" type="password" inputmode="numeric" maxlength="8" autocomplete="off" style="text-align:center;margin:10px 0"><button class="btn" onclick="if($('#pn').value==='2026'){S.adm=1;rAdmin()}else toast('Code incorrect')">Ouvrir</button></div></div>`}
/* ACCUEIL */
function rHome(){$('#main').innerHTML=`<div class="pad"><h1 style="font-size:26px">Bonjour, bienvenue à ${C[S.c].v} 👋</h1><p style="color:var(--mu);margin:2px 0 12px">Glissez pour choisir un service.</p></div>
<div class="car" id="car">${SV.map(s=>`<div class="sc" style="background:${s.bg}"><div class="big">${s.e}</div><div><h2>${s.t}</h2><p>${s.d}</p></div></div>`).join('')}</div>
<div class="dots" id="dots">${SV.map(()=>'<i></i>').join('')}</div><div class="pad" id="svc"></div>`;
const car=$('#car');car.onscroll=()=>{const w=car.children[0].offsetWidth+12;const i=Math.max(0,Math.min(2,Math.round(car.scrollLeft/w)));if(i!==S.svc){S.svc=i;rSvc()}};
car.scrollLeft=S.svc*(car.children[0].offsetWidth+12);rSvc()}
